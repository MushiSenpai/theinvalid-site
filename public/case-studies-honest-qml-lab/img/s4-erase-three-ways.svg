<svg viewBox="0 0 620 340" width="620" height="340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The engineered quantum advantage, erased three ways" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"><title>The engineered quantum advantage, erased three ways</title><rect x="0" y="0" width="620" height="340" fill="#0b0e14"/><text x="24" y="30" font-size="15" fill="#e8a33d" text-anchor="start" font-weight="bold">The engineered quantum advantage &#8212; erased three ways</text><text x="24" y="50" font-size="11" fill="#8a8f98" text-anchor="start">g-relabeled MNIST-0/1 (11 qubits, g=716) &#183; PQK reproduces the edge; fair classical + RFF + noise close it</text><line x1="62" y1="76" x2="62" y2="266" stroke="#1e2430" stroke-width="1"/><line x1="62" y1="266" x2="596" y2="266" stroke="#1e2430" stroke-width="1"/><line x1="62" y1="219.5" x2="596" y2="219.5" stroke="#1e2430" stroke-width="1"/><text x="54" y="223.5" font-size="10" fill="#8a8f98" text-anchor="end">0.25</text><line x1="62" y1="171" x2="596" y2="171" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4 4"/><text x="54" y="175" font-size="10" fill="#8a8f98" text-anchor="end">0.50</text><text x="596" y="167" font-size="9" fill="#8a8f98" text-anchor="end">chance</text><line x1="62" y1="123.5" x2="596" y2="123.5" stroke="#1e2430" stroke-width="1"/><text x="54" y="127.5" font-size="10" fill="#8a8f98" text-anchor="end">0.75</text><line x1="62" y1="76" x2="596" y2="76" stroke="#1e2430" stroke-width="1"/><text x="54" y="80" font-size="10" fill="#8a8f98" text-anchor="end">1.00</text><rect x="86" y="94" width="58" height="172" fill="#e8a33d"/><text x="115" y="86" font-size="12" fill="#e6e1d7" text-anchor="middle" font-weight="bold">0.900</text><text x="115" y="284" font-size="10" fill="#8a8f98" text-anchor="middle">PQK</text><text x="115" y="298" font-size="9" fill="#8a8f98" text-anchor="middle">(engineered)</text><rect x="192" y="152.6" width="58" height="113.4" fill="#ff6b6b"/><text x="221" y="144.6" font-size="12" fill="#e6e1d7" text-anchor="middle" font-weight="bold">0.730</text><text x="221" y="284" font-size="10" fill="#8a8f98" text-anchor="middle">weak</text><text x="221" y="298" font-size="9" fill="#8a8f98" text-anchor="middle">classical</text><rect x="298" y="92.1" width="58" height="173.9" fill="#4ade80"/><text x="327" y="84.1" font-size="12" fill="#e6e1d7" text-anchor="middle" font-weight="bold">0.910</text><text x="327" y="284" font-size="10" fill="#8a8f98" text-anchor="middle">fair</text><text x="327" y="298" font-size="9" fill="#8a8f98" text-anchor="middle">classical</text><rect x="404" y="94" width="58" height="172" fill="#4ade80"/><text x="433" y="86" font-size="12" fill="#e6e1d7" text-anchor="middle" font-weight="bold">0.900</text><text x="433" y="284" font-size="10" fill="#8a8f98" text-anchor="middle">RFF</text><text x="433" y="298" font-size="9" fill="#8a8f98" text-anchor="middle">dequant.</text><rect x="510" y="99.2" width="58" height="166.8" fill="#8a8f98"/><text x="539" y="91.2" font-size="12" fill="#e6e1d7" text-anchor="middle" font-weight="bold">0.885</text><text x="539" y="284" font-size="10" fill="#8a8f98" text-anchor="middle">PQK</text><text x="539" y="298" font-size="9" fill="#8a8f98" text-anchor="middle">@ noise</text><text x="18" y="171" font-size="11" fill="#8a8f98" text-anchor="middle" transform="rotate(-90 18 171)">test accuracy</text><text x="86" y="322" font-size="10" fill="#e8a33d">gold = the &#8220;quantum&#8221; result</text><text x="298" y="322" font-size="10" fill="#4ade80">green = classical matches or beats it</text></svg>
