<svg viewBox="0 0 720 260" width="720" height="260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QLAB publishing pipeline: experiment folder to blog-ready post" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace"><title>QLAB publishing pipeline: experiment folder to blog-ready post</title><rect x="0" y="0" width="720" height="260" fill="#0b0e14"/><text x="24" y="34" font-size="16" fill="#e8a33d" text-anchor="start" font-weight="bold">publishing pipeline</text><text x="24" y="54" font-size="12" fill="#8a8f98" text-anchor="start" font-weight="normal">experiment folder  →  honest, visual, reproducible post</text><rect x="24" y="84" width="180" height="150" rx="6" fill="#11151f" stroke="#1e2430" stroke-width="1"/><text x="38" y="110" font-size="12" fill="#e6e1d7" text-anchor="start" font-weight="bold">experiments/&lt;run&gt;/</text><text x="40" y="136" font-size="11" fill="#8a8f98" text-anchor="start" font-weight="normal">• summary.json</text><text x="40" y="160" font-size="11" fill="#8a8f98" text-anchor="start" font-weight="normal">• report.md</text><text x="40" y="184" font-size="11" fill="#8a8f98" text-anchor="start" font-weight="normal">• *.csv  (D7)</text><text x="40" y="208" font-size="11" fill="#8a8f98" text-anchor="start" font-weight="normal">• *.png / *.gif</text><rect x="268" y="84" width="176" height="150" rx="6" fill="#11151f" stroke="#e8a33d" stroke-width="1.5"/><text x="356" y="110" font-size="13" fill="#e8a33d" text-anchor="middle" font-weight="bold">qlab publish</text><text x="284" y="134" font-size="11" fill="#e6e1d7" text-anchor="start" font-weight="normal">› ELI10 intro</text><text x="284" y="154" font-size="11" fill="#e6e1d7" text-anchor="start" font-weight="normal">› results table</text><text x="284" y="174" font-size="11" fill="#e6e1d7" text-anchor="start" font-weight="normal">› reuse PNG/GIF</text><text x="284" y="194" font-size="11" fill="#e6e1d7" text-anchor="start" font-weight="normal">› + on-brand S